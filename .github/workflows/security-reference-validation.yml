name: Security Reference Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-reference-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: structurax-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PostgreSQL test driver
        run: |
          python -m pip install -e .
          python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Validate tenant-bound cryptographic reference controls
        run: python -m unittest tests.test_v10_security_reference -v

      - name: Validate PostgreSQL RLS reference
        env:
          DATABASE_URL: postgresql://postgres:structurax-ci-admin@localhost:5432/postgres
          STRUCTURAX_APP_PASSWORD: structurax-ci-app
        run: |
          python scripts/validate_postgres_rls.py > /tmp/structurax-postgres-rls.json
          cat /tmp/structurax-postgres-rls.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/structurax-postgres-rls.json').read_text())
          assert report['validation'] == 'passed'
          assert report['rls_enabled'] is True
          assert report['rls_forced'] is True
          assert report['application_role_bypassrls'] is False
          assert report['cross_tenant_insert_blocked'] is True
          assert report['cross_tenant_update_rows'] == 0
          assert report['production_database_validated'] is False
          assert report['production_identity_or_kms_validated'] is False
          PY
