name: Release Evidence Attestation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attested-release-evidence-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Build wheel
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Generate digest-bound release evidence bundle
        run: |
          python scripts/generate_dependency_sbom.py > dist/structurax-dependency-sbom.cdx.json
          python scripts/build_release_provenance.py > dist/structurax-source-provenance.json
          python scripts/assess_release_gate.py > dist/structurax-release-gate.json
          python scripts/build_release_evidence_manifest.py > dist/structurax-release-evidence-manifest.json
          python scripts/verify_release_evidence_manifest.py
          sha256sum dist/*.whl > dist/subject.checksums.txt

      - name: Verify independent review when present
        run: |
          if [ -f security-review/v1.0-review.json ]; then
            python scripts/verify_independent_review.py --review security-review/v1.0-review.json
          else
            echo "No v1.0 independent review evidence present; attestation remains preview-only."
          fi

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl

      - name: Attest dependency SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
          sbom-path: dist/structurax-dependency-sbom.cdx.json

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: structurax-attested-release-evidence-preview
          path: dist/
          if-no-files-found: error
