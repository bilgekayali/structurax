name: Release Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-prep-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Verify frozen stable API contract
        run: |
          python scripts/verify_stable_api.py > /tmp/structurax-api-contract.json
          grep -q '"final_v1_freeze": true' /tmp/structurax-api-contract.json
          grep -q '"status": "frozen-release-candidate"' /tmp/structurax-api-contract.json

      - name: Verify frozen stable schema contract
        run: |
          python scripts/verify_stable_schemas.py > /tmp/structurax-schema-contract.json
          grep -q '"final_v1_freeze": true' /tmp/structurax-schema-contract.json
          grep -q '"schema_count": 23' /tmp/structurax-schema-contract.json

      - name: Generate installed dependency-closure SBOM
        run: |
          python scripts/generate_dependency_sbom.py > /tmp/structurax-sbom.cdx.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/structurax-sbom.cdx.json').read_text())
          assert payload['bomFormat'] == 'CycloneDX'
          assert payload['specVersion'] == '1.5'
          names = {item['name'] for item in payload['components']}
          assert {'structurax', 'pydantic', 'cryptography'} <= names
          PY

      - name: Validate deployment reference non-claims
        run: |
          python scripts/validate_deployment_reference.py > /tmp/structurax-deployment-reference.json
          grep -q '"reference_validation": "passed"' /tmp/structurax-deployment-reference.json
          grep -q '"production_controls_validated": false' /tmp/structurax-deployment-reference.json
          grep -q '"production_readiness_claimed": false' /tmp/structurax-deployment-reference.json

      - name: Enforce fail-closed formal release gate
        run: |
          python scripts/assess_release_gate.py > /tmp/structurax-release-gate.json
          grep -q '"eligible": false' /tmp/structurax-release-gate.json
          grep -q '"postgresql_tenant_isolation_validated"' /tmp/structurax-release-gate.json
          grep -q '"external_identity_boundary_validated"' /tmp/structurax-release-gate.json
          grep -q '"evidence_encryption_and_key_management_validated"' /tmp/structurax-release-gate.json
          grep -q '"observability_and_deployment_controls_validated"' /tmp/structurax-release-gate.json
          grep -q '"independent_security_review_verified"' /tmp/structurax-release-gate.json
          grep -q '"main_branch_protection_verified"' /tmp/structurax-release-gate.json
          grep -q '"required_status_checks_verified"' /tmp/structurax-release-gate.json
          if grep -q '"package_version_not_1_0_0"' /tmp/structurax-release-gate.json; then exit 1; fi
          if grep -q '"stable_api_contract_frozen"' /tmp/structurax-release-gate.json; then exit 1; fi
          if grep -q '"stable_schema_contract_frozen"' /tmp/structurax-release-gate.json; then exit 1; fi

      - name: Run v1.0 release and governance gate tests
        run: |
          python -m unittest tests.test_v10_release_gates -v
          python -m unittest tests.test_v10_repository_governance -v
          python -m unittest tests.test_v10_contract_freeze_deployment -v
          python -m unittest tests.test_v10_production_evidence_harness -v
