name: Production Evidence Collection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-evidence-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Validate collection policy non-claims
        run: |
          grep -q '"private_key_handling_allowed": false' configs/production_evidence_collection_policy.json
          grep -q '"automatic_signature_allowed": false' configs/production_evidence_collection_policy.json
          grep -q '"automatic_gate_mutation_allowed": false' configs/production_evidence_collection_policy.json
          grep -q '"production_readiness_claimed": false' configs/production_evidence_collection_policy.json

      - name: Run production evidence collection tests
        run: python -m unittest tests.test_v10_production_evidence_collection -v

      - name: Enforce no committed production evidence from CI
        run: |
          test ! -f production-evidence/v1.0-controls.json
          test -z "$(find production-evidence -type f 2>/dev/null || true)"
