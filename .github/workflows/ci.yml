name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate reference packs
        run: |
          structurax validate --pack datasets/demo/clean_pack.json
          structurax validate --pack datasets/demo/risky_pack.json

      - name: Regenerate deterministic artifacts
        run: |
          python scripts/generate_schema.py
          python scripts/build_demo_reports.py

      - name: Verify committed artifacts
        run: git diff --exit-code -- schemas reports/demo

