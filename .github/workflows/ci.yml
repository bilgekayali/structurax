name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q src/structurax

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate package version
        run: python -c "import structurax; assert structurax.__version__ == '1.0.0'"

      - name: Validate reference packs
        run: |
          structurax validate --pack datasets/demo/clean_pack.json
          structurax validate --pack datasets/demo/risky_pack.json

      - name: Verify signed v0.2 fixture set
        run: |
          structurax verify-fixtures \
            --root . \
            --manifest datasets/ingestion/manifest.json \
            --signature datasets/ingestion/manifest.sig \
            --public-key datasets/ingestion/manifest.pub

      - name: Exercise network-free recorded ingestion
        run: |
          structurax ingest \
            --source datasets/ingestion/clean-invoice.pdf \
            --recordings datasets/ingestion/recorded_extractions.json \
            --output /tmp/structurax-ingestion.json
          grep -q '"external_execution_performed": false' /tmp/structurax-ingestion.json

      - name: Enforce closed v0.3-v0.5 core imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          banned = {"asyncio", "ftplib", "http", "httpx", "requests", "socket", "subprocess", "telnetlib", "urllib"}
          for relative in (
              "src/structurax/ai_adapters.py",
              "src/structurax/ai_evaluation.py",
              "src/structurax/review_workflow.py",
              "src/structurax/pilot.py",
              "src/structurax/construction_models.py",
              "src/structurax/construction_lineage.py",
              "src/structurax/construction_matching.py",
              "src/structurax/construction_intelligence.py",
          ):
              tree = ast.parse(Path(relative).read_text(encoding="utf-8"), filename=relative)
              found = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      found.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      found.add(node.module.split(".")[0])
              prohibited = sorted(found & banned)
              if prohibited:
                  raise SystemExit(f"{relative} imports prohibited live-execution modules: {prohibited}")
          PY

      - name: Exercise offline v0.3 AI replay and injection fallback
        run: |
          structurax ai-replay \
            --cases datasets/ai/benchmark_cases.json \
            --case-id clean-invoice \
            --recordings datasets/ai/recorded_adapter_a.json \
            --output /tmp/structurax-ai-clean.json
          grep -q '"status": "ai_selected"' /tmp/structurax-ai-clean.json
          grep -q '"automation_authority": false' /tmp/structurax-ai-clean.json
          structurax ai-replay \
            --cases datasets/ai/benchmark_cases.json \
            --case-id prompt-injection-invoice \
            --recordings datasets/ai/recorded_adapter_a.json \
            --output /tmp/structurax-ai-injection.json
          grep -q '"status": "deterministic_fallback"' /tmp/structurax-ai-injection.json
          grep -q '"adapter_invoked": false' /tmp/structurax-ai-injection.json

      - name: Exercise synthetic v0.3 adapter benchmark
        run: |
          structurax ai-benchmark \
            --cases datasets/ai/benchmark_cases.json \
            --recordings datasets/ai/recorded_adapter_a.json \
            --recordings datasets/ai/recorded_adapter_b.json \
            --output /tmp/structurax-ai-benchmark.json
          grep -q '"live_model_calls_performed": false' /tmp/structurax-ai-benchmark.json

      - name: Exercise v0.4 workflow and pilot gates
        run: |
          python scripts/evaluate_pilot_controls.py
          grep -q '"eligible": false' reports/evaluation/v0.4-pilot-readiness.json
          grep -q '"independent_security_review_missing"' reports/evaluation/v0.4-pilot-readiness.json
          grep -q '"deployment_performed": false' reports/evaluation/v0.4-pilot-readiness.json

      - name: Exercise v0.5 construction intelligence
        run: |
          python scripts/build_construction_reference.py
          structurax construction-analyze \
            --case datasets/construction/clean_case.json \
            --policy configs/construction_policy.json \
            --output /tmp/structurax-construction-clean.json
          grep -q '"findings": \[\]' /tmp/structurax-construction-clean.json
          grep -q '"status": "matched"' /tmp/structurax-construction-clean.json
          structurax construction-analyze \
            --case datasets/construction/risky_case.json \
            --policy configs/construction_policy.json \
            --output /tmp/structurax-construction-risky.json
          grep -q '"status": "block"' /tmp/structurax-construction-risky.json
          grep -q '"rule_id": "PROJECT_INVOICED_COST_OVERRUN"' /tmp/structurax-construction-risky.json
          grep -q '"automation_authority": false' /tmp/structurax-construction-risky.json
          grep -q '"operational_side_effects_performed": false' /tmp/structurax-construction-risky.json

      - name: Verify deterministic repository review digest
        run: |
          digest_one="$(python scripts/repository_review_digest.py)"
          digest_two="$(python scripts/repository_review_digest.py)"
          test "$digest_one" = "$digest_two"
          test "${#digest_one}" -eq 64

      - name: Regenerate deterministic artifacts
        run: |
          python scripts/build_ai_fixtures.py
          python scripts/build_pilot_reference.py
          python scripts/build_construction_reference.py
          python scripts/generate_schema.py
          python scripts/build_construction_schemas.py
          python scripts/build_demo_reports.py
          python scripts/evaluate_rule_cases.py
          python scripts/evaluate_ai_adapters.py
          python scripts/evaluate_pilot_controls.py

      - name: Verify committed artifacts
        run: |
          git diff --exit-code -- configs/pilot_policy.json configs/pilot_plan.json configs/construction_policy.json datasets/ai datasets/workflow datasets/construction schemas reports/demo reports/evaluation
          test -z "$(git status --porcelain -- configs/pilot_policy.json configs/pilot_plan.json configs/construction_policy.json datasets/ai datasets/workflow datasets/construction schemas reports/demo reports/evaluation)"