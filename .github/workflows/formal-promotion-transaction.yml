name: Formal Promotion Transaction

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-promotion-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Build current fail-closed promotion readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/assess_promotion_readiness.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --output /tmp/structurax-promotion-readiness.json

      - name: Build non-mutating formal promotion plan
        run: |
          python scripts/build_formal_promotion_plan.py \
            --readiness /tmp/structurax-promotion-readiness.json \
            --expected-head-sha "$GITHUB_SHA" \
            --output /tmp/structurax-formal-promotion-plan.json
          cat /tmp/structurax-formal-promotion-plan.json

      - name: Enforce pre-release fail-closed semantics
        run: |
          grep -q '"promotion_plan_eligible": false' /tmp/structurax-formal-promotion-plan.json
          grep -q '"automatic_metadata_mutation_allowed": false' /tmp/structurax-formal-promotion-plan.json
          grep -q '"automatic_tag_creation_allowed": false' /tmp/structurax-formal-promotion-plan.json
          grep -q '"automatic_publish_allowed": false' /tmp/structurax-formal-promotion-plan.json
          grep -q '"production_readiness_claimed": false' /tmp/structurax-formal-promotion-plan.json

      - name: Run formal promotion transaction tests
        run: python -m unittest tests.test_v10_formal_promotion_transaction -v
