name: Promotion Readiness

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Build exact branch-protection payload
        run: |
          python scripts/build_branch_protection_payload.py \
            --repository "$GITHUB_REPOSITORY" \
            --output /tmp/structurax-branch-protection-payload.json
          cat /tmp/structurax-branch-protection-payload.json

      - name: Assess live promotion readiness without privileged evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/assess_promotion_readiness.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --output /tmp/structurax-promotion-readiness.json
          cat /tmp/structurax-promotion-readiness.json

      - name: Enforce fail-closed non-claim semantics
        run: |
          grep -q '"ready_for_human_promotion": false' /tmp/structurax-promotion-readiness.json
          grep -q '"formal_gate_mutation_authorized": false' /tmp/structurax-promotion-readiness.json
          grep -q '"production_readiness_claimed": false' /tmp/structurax-promotion-readiness.json

      - name: Run promotion handoff tests
        run: python -m unittest tests.test_v10_promotion_handoff -v
